// Background darkening per stage: [top, middle, bottom], 0 = untouched, 1 = black. Tune after seeing it live.
const DIM = { mongol:[0.08, 0.18, 0.6], knight:[0.08, 0.18, 0.6], viking:[0.08, 0.18, 0.6], samurai:[0.08, 0.18, 0.6], spartan:[0.08, 0.18, 0.6] };
let STAGE, MAIN, PLATS;
function loadStage(st){
  STAGE = st;

const BG_IMG = {};
if (typeof Image !== "undefined") STAGES.forEach(st => { const img = new Image(); img.src = st.bg; BG_IMG[st.key] = img; });
function updatePlats(dt){
  for (const p of PLATS){
    if (!p.move){ p.dx = 0; continue; }
    p.t += dt * p.move.speed;
    const nx = p.baseX + Math.sin(p.t) * p.move.range;
    p.dx = nx - p.x; p.x = nx;
  }
}

// ─── Stage dressing: ambient life per stage ───
let animT = 0, ambAcc = 0, bgShift = 0;
const ambient = [];
const rnd = (a, b) => a + Math.random() * (b - a);
const AMBIENT = {
  mongol:  { rate:26, make:() => ({ kind:"dust",  x:-20, y:rnd(60, 560), vx:rnd(160, 300), vy:rnd(-8, 8),  life:9,  size:rnd(1.2, 2.6), wob:rnd(0, 6) }) },
  knight:  { rate:9,  make:() => ({ kind:"ember", x:rnd(0, W), y:H + 10, vx:rnd(-15, 15), vy:rnd(-55, -30),  life:12, size:rnd(1.2, 2.2), wob:rnd(0, 6), color:"#FFB050" }) },
  viking:  { rate:38, make:() => ({ kind:"snow",  x:rnd(-150, W), y:-10, vx:rnd(25, 70), vy:rnd(55, 115), life:13, size:rnd(1.4, 3.4), wob:rnd(0, 6) }) },
  samurai: { rate:12, make:() => ({ kind:"petal", x:rnd(-60, W), y:-10, vx:rnd(25, 75), vy:rnd(30, 70),   life:16, size:rnd(3, 5),     wob:rnd(0, 6), rot:rnd(0, 6) }) },
  spartan: { rate:11, make:() => ({ kind:"ember", x:rnd(0, W), y:H + 10, vx:rnd(-25, 25), vy:rnd(-130, -60), life:7, size:rnd(1.4, 3),   wob:rnd(0, 6), color:"#FF8A3A" }) },
};
function torchSpots(){ return [ { x:MAIN.x + 26, y:MAIN.y - 36 }, { x:MAIN.x + MAIN.w - 26, y:MAIN.y - 36 } ]; }
function updateAmbient(dt){
  const cfg = STAGE && AMBIENT[STAGE.key];
  if (!cfg) return;
  ambAcc += cfg.rate * dt;
  while (ambAcc >= 1 && ambient.length < 320){
    ambAcc -= 1;
    const p = cfg.make(); p.max = p.life; p.front = Math.random() < 0.18; if (p.front) p.size *= 1.8;
    ambient.push(p);
  }
  if (ambAcc >= 1) ambAcc = 0;
  if (STAGE.key === "knight" && Math.random() < dt * 7){        // sparks off the torches
    const t = torchSpots()[Math.random() < 0.5 ? 0 : 1];
    ambient.push({ kind:"ember", x:t.x + rnd(-4, 4), y:t.y - 22, vx:rnd(-20, 20), vy:rnd(-90, -50), life:1.6, max:1.6, size:rnd(1, 1.8), wob:rnd(0, 6), color:"#FFC060", front:false });
  }
  for (let i = ambient.length - 1; i >= 0; i--){
    const p = ambient[i];
    const sway = Math.sin(animT * 1.6 + p.wob);
    p.x += (p.vx + sway * (p.kind === "petal" ? 40 : p.kind === "snow" ? 18 : 10)) * dt;
    p.y += p.vy * dt;
    if (p.rot !== undefined) p.rot += dt * 2;
    p.life -= dt;
    if (p.life <= 0 || p.x > W + 60 || p.y > H + 40 || p.y < -60) ambient.splice(i, 1);
  }
}
function resetAmbient(){ ambient.length = 0; ambAcc = 0; for (let i = 0; i < 160; i++){ animT += 0.05; updateAmbient(0.05); } }
const BLAST = { l:-260, r:W+260, t:-260, b:H+220 };

// ─── Input ───
const down = new Set(), pressed = new Set();
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (!down.has(k)) pressed.add(k);
  down.add(k);
  if ([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)) e.preventDefault();
});
addEventListener("keyup", e => down.delete(e.key.toLowerCase()));
const P1KEYS = { left:"a", right:"d", up:"w", down:"s", light:"f", heavy:"g", dodge:"h", grab:"r", sig:"t" };
const P2KEYS = { left:"arrowleft", right:"arrowright", up:"arrowup", down:"arrowdown", light:"k", heavy:"l", dodge:"j", grab:"i", sig:"o" };
const blankInput = () => ({ left:false, right:false, up:false, down:false, jumpP:false, lightP:false, heavyP:false,
  dodgeP:false, dodge:false, grabP:false, sigP:false, leftP:false, rightP:false, upP:false, downP:false });
function keyInput(k){
  return { left:down.has(k.left), right:down.has(k.right), up:down.has(k.up), down:down.has(k.down),
    jumpP:pressed.has(k.up), lightP:pressed.has(k.light), heavyP:pressed.has(k.heavy),
    dodgeP:pressed.has(k.dodge), dodge:down.has(k.dodge), grabP:pressed.has(k.grab), sigP:pressed.has(k.sig),
    leftP:pressed.has(k.left), rightP:pressed.has(k.right), upP:pressed.has(k.up), downP:pressed.has(k.down) };
}
// Controller (Xbox/PS layout): stick/d-pad move · A jump · X light · B heavy · Y signature · LB grab · RB/triggers shield & dodge
const padPrev = [{}, {}];
function padInput(i){
  const gp = (navigator.getGamepads ? navigator.getGamepads() : [])[i];
  if (!gp) return null;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const b = n => !!(gp.buttons[n] && gp.buttons[n].pressed);
  const prev = padPrev[i], edge = n => b(n) && !prev[n];
  const L = ax < -0.4 || b(14), R = ax > 0.4 || b(15), U = ay < -0.5 || b(12), D = ay > 0.5 || b(13);
  const r = {
    left:L, right:R, up: ay < -0.5 || b(12), down: ay > 0.5 || b(13),
    jumpP: edge(0), lightP: edge(2), heavyP: edge(1), grabP: edge(4), sigP: edge(3),
    dodgeP: edge(5) || edge(6) || edge(7), dodge: b(5) || b(6) || b(7),
    leftP: L && !prev.L, rightP: R && !prev.R, upP: U && !prev.U, downP: D && !prev.D,
  };
  for (let n = 0; n < 16; n++) prev[n] = b(n);
  prev.L = L; prev.R = R; prev.U = U; prev.D = D;
  return r;
}
function merge(a, b){ if (!b) return a; const o = {}; for (const k in a) o[k] = a[k] || b[k]; return o; }

// ─── Game state ───
let P1, P2, state = "menu", winner = null, paused = false, hitstop = 0, shake = 0, playTime = 0;

// ─── Settings (remembered on this device) ───

  { key:"random", name:"RANDOM",    desc:"Any stage, picked at random" },

const DIFFS = { easy:{ name:"EASY", react:1.9, def:0.4 }, normal:{ name:"NORMAL", react:1.0, def:1.0 }, hard:{ name:"HARD", react:0.5, def:1.9 } };

const parts = [], projs = [], floats = [];

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const c = s => Math.max(0, Math.min(255, ((n >> s) & 255) + amt));
  return "#" + ((c(16) << 16) | (c(8) << 8) | c(0)).toString(16).padStart(6, "0");
}
function makeFighter(o){
  const S = o.stats;
  return { tag:o.tag, name:S.name, color:o.color, stats:S, keys:o.keys, cpu:false,
    x:o.x, y:MAIN.y, vx:0, vy:0, w:44, h:76, facing:o.facing, onGround:true, ground:MAIN, jumps:S.jumps,
    dmg:0, stocks:T.stocks, attack:null, atkT:0, fired:false, hitIds:new Set(),
    hitstun:0, knockdown:0, dizzy:0, dodgeT:0, dodgeCD:0, airDodged:false,
    shielding:false, wasShielding:false, shieldHP:T.shieldMax, sigCD:0, downHeld:0,
    grabbing:null, grabbedBy:null, grabT:0,
    invuln:0, flash:0, dropT:0, dead:false, respawnT:0, spin:0, ai:{ think:0, plan:null, shieldT:0 } };
}
function startGame(){
  T.stocks = settings.stocks;
  const s1 = WARRIORS[pick.p1], s2 = WARRIORS[pick.p2];
  P1 = makeFighter({ tag:"P1", stats:s1, color:s1.color, keys:P1KEYS, x:W/2 - 160, facing:1 });
  P2 = makeFighter({ tag:vsCpu ? "CPU" : "P2", stats:s2, color: pick.p1 === pick.p2 ? shade(s2.color, 70) : s2.color, keys:P2KEYS, x:W/2 + 160, facing:-1 });
  P2.cpu = vsCpu;
  loadStage(STAGE);
  resetAmbient(); bgShift = 0;
  homeTag = STAGE.owner === P1.name ? P1 : STAGE.owner === P2.name ? P2 : null;
  parts.length = 0; projs.length = 0; floats.length = 0;

}
function goSelect(){ pick.p1ok = false; pick.p2ok = false; state = "select"; }
const approach = (v, t, amt) => v < t ? Math.min(v + amt, t) : Math.max(v - amt, t);
const atk = f => f.attack ? ATTACKS[f.attack] : null;
function hasArmor(f){ const A = atk(f); return !!(A && A.armor && f.atkT < A.startup + A.active); }
function popText(text, x, y, color){ floats.push({ text, x, y, color, life:0.9 }); }

function startAttack(f, name){ f.attack = name; f.atkT = 0; f.fired = false; f.hitIds = new Set(); }

// ─── Fighter update ───
function updateFighter(f, inp, dt){
  if (f.dead){ f.respawnT -= dt; if (f.respawnT <= 0) respawn(f); return; }
  f.invuln = Math.max(0, f.invuln - dt); f.flash = Math.max(0, f.flash - dt);
  f.dodgeCD = Math.max(0, f.dodgeCD - dt); f.dropT = Math.max(0, f.dropT - dt); f.sigCD = Math.max(0, f.sigCD - dt);
  if (!f.shielding) f.shieldHP = Math.min(T.shieldMax, f.shieldHP + T.shieldRegen * dt);

  if (f.grabbedBy){ f.shielding = false; return; }       // held: the grabber controls us

  if (f.grabbing){                                          // holding someone: pick a throw
    f.grabT += dt; f.vx = 0; f.vy = 0;
    const v = f.grabbing; v.x = f.x + f.facing * 42; v.y = f.y; v.vx = 0; v.vy = 0;
    let dirKey = null;
    if (f.grabT > 0.1){
      if (inp.up) dirKey = "up"; else if (inp.down) dirKey = "down";
      else if (inp.left || inp.right) dirKey = (inp.right ? 1 : -1) === f.facing ? "forward" : "back";
    }
    if (!dirKey && f.grabT >= T.grabHold) dirKey = "forward";
    if (dirKey) doThrow(f, dirKey);
    return;
  }

  const S = f.stats;
  const stunned = f.hitstun > 0 || f.knockdown > 0 || f.dizzy > 0;
  if (f.hitstun > 0){ f.hitstun -= dt; f.spin += dt * 14; } else f.spin = 0;
  if (f.knockdown > 0) f.knockdown -= dt;
  if (f.dizzy > 0) f.dizzy -= dt;

  // Shield: hold dodge on the ground without a direction
  f.wasShielding = f.shielding;
  f.shielding = !stunned && f.onGround && inp.dodge && !inp.left && !inp.right && !f.attack && f.dodgeT <= 0 && f.shieldHP > 0;
  if (f.shielding){
    f.shieldHP -= T.shieldDrain * dt;
    f.vx = approach(f.vx, 0, T.friction * dt);
    if (f.shieldHP <= 0) breakShield(f);
  }

  // Dodge / roll (roll = dodge + direction on the ground, also works straight out of shield)
  const rollOut = f.wasShielding && inp.dodge && (inp.left || inp.right);
  if (f.dodgeT > 0){ f.dodgeT -= dt; if (f.dodgeT <= 0){ f.vx *= 0.3; if (f.vy < 0) f.vy *= 0.3; } }
  else if (!stunned && !f.shielding && !f.attack && (inp.dodgeP || rollOut) && f.dodgeCD <= 0 && !(f.airDodged && !f.onGround)){
    const dir = inp.left ? -1 : inp.right ? 1 : 0;
    if (!f.onGround || dir !== 0){
      f.dodgeT = T.dodgeTime; f.dodgeCD = T.dodgeCooldown; f.invuln = Math.max(f.invuln, T.dodgeTime);
      f.vx = dir * T.dodgeSpeed;
      if (!f.onGround){ f.vy = inp.up ? -420 : inp.down ? 420 : f.vy * 0.2; f.airDodged = true; }
    }
  }

  const canAct = !stunned && f.dodgeT <= 0;
  if (canAct && !f.shielding){
    const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if (dir !== 0 && !f.attack) f.facing = dir;
    const max = (f.onGround ? T.runSpeed : T.airSpeed) * S.speed * (f.attack ? 0.35 : 1);
    const acc = f.onGround ? T.groundAccel : T.airAccel;
    if (dir !== 0){ if (f.vx * dir < max) f.vx = Math.min(max, f.vx * dir + acc * dt) * dir; }
    else if (f.onGround) f.vx = approach(f.vx, 0, T.friction * dt);
    if (f.onGround && Math.abs(f.vx) > max) f.vx = approach(f.vx, Math.sign(f.vx) * max, T.friction * dt);

    // Hold down on a thin platform to drop through it
    f.downHeld = inp.down ? f.downHeld + dt : 0;
    if (f.downHeld > T.dropHold && f.onGround && f.ground && !f.ground.solid && !f.attack){ f.dropT = 0.25; f.onGround = false; f.y += 2; f.downHeld = 0; }
    if (inp.down && !f.onGround && f.vy > 0) f.vy = Math.max(f.vy, 650);   // fast fall

    if (!f.attack){
      if (inp.grabP && f.onGround) startAttack(f, "grab");
      else if (inp.sigP && f.sigCD <= 0){ startAttack(f, S.sig); f.sigCD = ATTACKS[S.sig].cd; }
      else if (inp.lightP || inp.heavyP) startAttack(f, inp.heavyP ? (inp.up ? "upHeavy" : "heavy") : (inp.up ? "upLight" : "light"));
    }
  } else if (stunned){
    f.vx = f.onGround ? approach(f.vx, 0, T.friction * 0.5 * dt) : approach(f.vx, 0, T.airDrag * dt);
  }

  // Jump (works out of shield too)
  if (canAct && inp.jumpP && f.jumps > 0 && !f.attack){
    f.shielding = false;
    const wasGround = f.onGround;
    f.vy = -(wasGround ? T.jumpVel : T.doubleJumpVel) * S.jump; f.jumps--; f.onGround = false;
    if (!wasGround) sparks(f.x, f.y, "#C9A15A", 5, 160);
  }

  // Advance the current attack
  if (f.attack){
    const A = ATTACKS[f.attack]; f.atkT += dt;
    const inActive = f.atkT >= A.startup && f.atkT <= A.startup + A.active;
    if (A.dash && inActive){ f.vx = f.facing * A.dash; if (f.vy > 0) f.vy *= 0.5; }
    if (A.invulnActive && inActive) f.invuln = Math.max(f.invuln, 0.03);
    if (A.projectile && !f.fired && f.atkT >= A.startup){ f.fired = true; spawnArrow(f, A); }
    if (f.atkT > A.startup + A.active + A.recovery) f.attack = null;
  }

  // Gravity
  let g = T.gravity;
  if (f.hitstun > 0) g *= T.hitstunGravity;
  if (f.dodgeT > 0 && !f.onGround) g *= 0.3;
  const maxFall = (inp.down && canAct) ? T.fastFall : T.maxFall;
  f.vy = Math.min(f.vy + g * dt, maxFall);

  moveAndCollide(f, dt);

  if (f.x < BLAST.l || f.x > BLAST.r || f.y > BLAST.b || f.y - f.h < BLAST.t) KO(f);
}

function moveAndCollide(f, dt){
  const wasGround = f.onGround;
  if (f.onGround && f.ground && f.ground.dx) f.x += f.ground.dx;   // ride moving platforms
  f.x += f.vx * dt;
  const l = f.x - f.w/2, r = f.x + f.w/2;
  if (l < MAIN.x + MAIN.w && r > MAIN.x && f.y > MAIN.y + 4 && f.y - f.h < MAIN.y + MAIN.h){
    f.x = f.x < MAIN.x + MAIN.w/2 ? MAIN.x - f.w/2 : MAIN.x + MAIN.w + f.w/2; f.vx = 0;
  }
  const prevFeet = f.y, prevHead = f.y - f.h;
  f.y += f.vy * dt;
  f.onGround = false; f.ground = null;
  const L = f.x - f.w/2, R = f.x + f.w/2;
  for (const p of PLATS){
    if (R <= p.x || L >= p.x + p.w) continue;
    if (f.vy >= 0 && prevFeet <= p.y + 0.5 && f.y >= p.y){
      if (!p.solid && f.dropT > 0) continue;
      f.y = p.y; f.vy = 0; f.onGround = true; f.ground = p; break;
    }
    if (p.solid && f.vy < 0 && prevHead >= p.y + p.h && f.y - f.h < p.y + p.h){ f.y = p.y + p.h + f.h; f.vy = 0; }
  }
  if (f.onGround){ f.jumps = f.stats.jumps; f.airDodged = false; if (f.hitstun > 0.05 && !wasGround) f.hitstun = 0.05; }
  else if (wasGround && f.vy >= 0) f.jumps = Math.min(f.jumps, f.stats.jumps - 1);
}

// ─── Hits, grabs, shields, throws ───
function body(b){ return { x:b.x - b.w/2, y:b.y - b.h, w:b.w, h:b.h }; }
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function hitbox(f){
  const A = atk(f);
  if (!A || f.dead || A.noHit || A.projectile) return null;
  if (f.atkT < A.startup || f.atkT > A.startup + A.active) return null;
  const reach = (A.grab || f.attack.startsWith("sig_")) ? 1 : f.stats.reach;
  const cx = f.x + A.ox * reach * f.facing, cy = f.y + A.oy, w = A.w * reach;
  return { x:cx - w/2, y:cy - A.h/2, w, h:A.h, A };
}
function checkHits(a, b){
  const hb = hitbox(a);
  if (!hb || b.dead || b.grabbedBy || a.hitIds.has(b)) return;
  if (!overlap(hb, body(b))) return;
  const A = hb.A;
  if (A.grab){
    if (b.invuln > 0 || b.dodgeT > 0 || !b.onGround || b.grabbing) return;
    a.hitIds.add(b); a.attack = null; a.grabbing = b; a.grabT = 0;
    b.grabbedBy = a; b.attack = null; b.shielding = false; b.hitstun = 0; b.knockdown = 0; b.dizzy = 0;
    return;
  }
  if (b.invuln > 0) return;
  a.hitIds.add(b);
  const dir = A.ox === 0 ? (Math.sign(b.x - a.x) || a.facing) : a.facing;
  if (b.shielding){ shieldHit(b, A, dir, a); return; }
  applyHit(a, b, A, dir);
}
function applyHit(a, b, A, dir){
  const pw = a.stats.power;
  b.dmg += A.dmg * pw;
  if (b.grabbing){ b.grabbing.grabbedBy = null; b.grabbing = null; }
  if (hasArmor(b)){                                         // armored: take damage, don't flinch
    b.flash = 0.1; hitstop = 0.03; shake = Math.max(shake, 4);
    sparks(b.x, b.y - b.h/2, "#FFFFFF", 8, 240); return;
  }
  const kb = (A.base + b.dmg * A.scale) * pw / b.stats.weight;
  const ang = A.angle * Math.PI / 180;
  b.vx = Math.cos(ang) * kb * dir; b.vy = -Math.sin(ang) * kb;
  b.onGround = false; b.attack = null; b.dodgeT = 0; b.shielding = false;
  b.hitstun = Math.min(1.1, 0.12 + kb / 1400);
  b.flash = 0.12;
  hitstop = A.shake ? 0.08 : 0.045;
  shake = Math.max(shake, A.shake || 3);
  sparks(b.x, b.y - b.h/2, "#FFE9B0", A.shake ? 16 : 9, A.shake ? 420 : 260);
  sparks(b.x, b.y - b.h/2, a.color, 6, 300);
}
function shieldHit(b, A, dir, a){
  b.shieldHP -= A.dmg * 2.4 * (a ? a.stats.power : 1);
  b.vx = dir * 170;
  if (a) a.vx = -dir * 110;
  hitstop = 0.03;
  sparks(b.x - dir * 20, b.y - b.h/2, "#BFE3FF", 7, 220);
  if (b.shieldHP <= 0) breakShield(b);
}
function breakShield(f){
  f.shielding = false; f.shieldHP = 40; f.dizzy = T.shieldBreakStun;
  f.vy = -520; f.onGround = false; shake = Math.max(shake, 10);
  popText("SHIELD BREAK!", f.x, f.y - f.h - 30, "#BFE3FF");
}
function doThrow(f, dirKey){
  const v = f.grabbing; f.grabbing = null; v.grabbedBy = null;
  const TH = THROWS[dirKey];
  let dir = f.facing;
  if (dirKey === "back"){ v.x = f.x - f.facing * 42; dir = -f.facing; f.facing = -f.facing; }
  applyHit(f, v, TH, dir);
  if (TH.knockdown) v.knockdown = TH.knockdown;
  popText(TH.name, v.x, v.y - v.h - 24, f.color);
  startAttack(f, "throwLag");
}
function spawnArrow(f, A){ projs.push({ x:f.x + f.facing * 30, y:f.y - 48, vx:f.facing * A.speed, owner:f, A, life:1.1 }); }
function updateProjs(dt){
  for (let i = projs.length - 1; i >= 0; i--){
    const p = projs[i]; p.x += p.vx * dt; p.life -= dt;
    let hit = false;
    for (const b of [P1, P2]){
      if (b === p.owner || b.dead || b.invuln > 0 || b.grabbedBy) continue;
      const bb = body(b);
      if (p.x > bb.x - 14 && p.x < bb.x + bb.w + 14 && p.y > bb.y && p.y < bb.y + bb.h){
        const dir = Math.sign(p.vx);
        if (b.shielding) shieldHit(b, p.A, dir, null); else applyHit(p.owner, b, p.A, dir);
        hit = true; break;
      }
    }
    if (hit || p.life <= 0 || p.x < -100 || p.x > W + 100) projs.splice(i, 1);
  }
}
function releaseGrabs(f){
  if (f.grabbing){ f.grabbing.grabbedBy = null; f.grabbing = null; }
  if (f.grabbedBy){ f.grabbedBy.grabbing = null; f.grabbedBy = null; }
}
function KO(f){
  releaseGrabs(f);
  f.stocks--; f.dead = true; f.respawnT = 1.0; shake = 16;
  const cx = Math.max(20, Math.min(W - 20, f.x)), cy = Math.max(20, Math.min(H - 20, f.y - f.h/2));
  sparks(cx, cy, f.color, 40, 700); sparks(cx, cy, "#FFFFFF", 20, 500);
  if (f.stocks <= 0){ state = "over"; winner = f === P1 ? P2 : P1; }
}
function respawn(f){
  Object.assign(f, { dead:false, x: W/2 + (f === P1 ? -80 : 80), y:120, vx:0, vy:0, dmg:0, invuln:T.respawnInvuln,
    attack:null, hitstun:0, knockdown:0, dizzy:0, jumps:f.stats.jumps, dodgeT:0, onGround:false,
    shielding:false, shieldHP:T.shieldMax, sigCD:0, grabbing:null, grabbedBy:null });
}

// ─── CPU opponent (beatable on purpose — has reaction delay) ───
function sigInRange(sig, adx, ady){
  switch (sig){
    case "sig_arrow":    return adx > 180 && ady < 60;
    case "sig_charge":   return adx > 110 && adx < 320 && ady < 50;
    case "sig_scramble": return adx > 90 && adx < 280 && ady < 60;
    case "sig_iaido":    return adx > 90 && adx < 210 && ady < 50;
    case "sig_slam":     return adx < 110 && ady < 60;
  }
  return false;
}
function cpuInput(me, op){
  const inp = blankInput();
  if (me.dead || op.dead || me.grabbedBy) return inp;
  if (me.grabbing){                                   // choose a throw
    if (me.grabT > 0.15){
      const nearRight = (MAIN.x + MAIN.w - me.x) < (me.x - MAIN.x);
      if (op.dmg >= 85) inp[nearRight ? "right" : "left"] = true;
      else if (Math.random() < 0.5) inp.down = true; else inp.up = true;
    }
    return inp;
  }
  if (me.hitstun > 0 || me.knockdown > 0 || me.dizzy > 0) return inp;
  const cx = MAIN.x + MAIN.w/2;
  const offStage = me.x < MAIN.x - 8 || me.x > MAIN.x + MAIN.w + 8 || me.y > MAIN.y + 5;
  if (offStage){
    if (me.x < cx) inp.right = true; else inp.left = true;
    if (me.vy > 40 && me.jumps > 0 && Math.random() < 0.3) inp.jumpP = true;
    if (me.jumps === 0 && me.y > MAIN.y && me.dodgeCD <= 0 && !me.airDodged){ inp.dodgeP = true; inp.up = true; }
    return inp;
  }
  const dx = op.x - me.x, dy = op.y - me.y, adx = Math.abs(dx), ady = Math.abs(dy);
  const towards = dx > 0 ? "right" : "left";
  const facingOp = (dx > 0) === (me.facing > 0);

  if (me.ai.shieldT > 0){ me.ai.shieldT -= 1/60; inp.dodge = true; return inp; }
  const oA = atk(op);
  if (oA && !oA.noHit && op.atkT < oA.startup && adx < 130 && ady < 80){
    const r = Math.random();
    const dfn = DIFFS[settings.cpu].def;
    if (me.onGround && r < 0.05 * dfn){ me.ai.shieldT = 0.3 + Math.random() * 0.25; inp.dodge = true; inp.dodgeP = true; return inp; }
    if (r < 0.08 * dfn && me.dodgeCD <= 0){ inp.dodgeP = true; inp[dx > 0 ? "left" : "right"] = true; return inp; }
  }
  me.ai.think -= 1/60;
  if (me.ai.think <= 0){
    me.ai.think = (0.16 + Math.random() * 0.24) * DIFFS[settings.cpu].react;   // reaction time (difficulty)
    const r = Math.random();
    let plan = "approach";
    if (op.shielding && adx < 75 && me.onGround) plan = "grab";
    else if (me.sigCD <= 0 && sigInRange(me.stats.sig, adx, ady) && r < 0.35) plan = "sig";
    else if (adx < 70 && ady < 50 && me.onGround && op.onGround && r < 0.2) plan = "grab";
    else if (adx < 85 && ady < 60) plan = Math.random() < 0.62 ? "light" : "heavy";
    else if (dy < -80 && adx < 90) plan = Math.random() < 0.6 ? "upLight" : "upHeavy";
    if (Math.random() < 0.06 && me.onGround) plan = "jump";
    me.ai.plan = plan;
  }
  const plan = me.ai.plan;
  switch (plan){
    case "upLight": case "upHeavy":
      inp.up = true; if (plan === "upHeavy") inp.heavyP = true; else inp.lightP = true; me.ai.plan = null; break;
    case "light": case "heavy": case "grab":
      if (!facingOp){ inp[towards] = true; break; }
      if (plan === "grab"){ if (me.onGround) inp.grabP = true; }
      else if (plan === "heavy") inp.heavyP = true; else inp.lightP = true;
      me.ai.plan = null; break;
    case "sig":
      if (!facingOp && me.stats.sig !== "sig_slam"){ inp[towards] = true; break; }
      inp.sigP = true; me.ai.plan = null; break;
    case "jump": inp.jumpP = true; me.ai.plan = "approach"; break;
    case "approach":
      inp[towards] = true;
      if (dy < -120 && me.onGround && Math.random() < 0.06) inp.jumpP = true;
      if (dy > 80 && me.onGround && me.ground && !me.ground.solid) inp.down = true;
      break;
  }
  if ((me.x < MAIN.x + 30 && inp.left) || (me.x > MAIN.x + MAIN.w - 30 && inp.right)){ inp.left = false; inp.right = false; }
  return inp;
}

// ─── Particles & floating text ───
function sparks(x, y, color, n, speed){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random());
    const life = 0.25 + Math.random() * 0.35;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life, max:life, color });
  }
}
function updateFx(dt){
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 900*dt; p.vx *= 0.98; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--){
    const t = floats[i]; t.y -= 50 * dt; t.life -= dt;
    if (t.life <= 0) floats.splice(i, 1);
  }
}

// ─── Main step ───
function menuStartPressed(){
  const gp = (navigator.getGamepads ? navigator.getGamepads() : [])[0];
  return gp && gp.buttons[9] && gp.buttons[9].pressed;
}
function stepSelect(){
  if (pressed.has("escape")){ state = "menu"; return; }
  const n = WARRIORS.length;
  const i1 = merge(keyInput(P1KEYS), padInput(0));
  if (!pick.p1ok){
    if (i1.leftP) pick.p1 = (pick.p1 + n - 1) % n;
    if (i1.rightP) pick.p1 = (pick.p1 + 1) % n;
    if (i1.lightP || i1.jumpP){ pick.p1ok = true; if (vsCpu){ pick.p2 = Math.floor(Math.random() * n); pick.p2ok = true; } }
  }
  if (!vsCpu){
    const i2 = merge(keyInput(P2KEYS), padInput(1));
    if (!pick.p2ok){
      if (i2.leftP) pick.p2 = (pick.p2 + n - 1) % n;
      if (i2.rightP) pick.p2 = (pick.p2 + 1) % n;
      if (i2.lightP || i2.jumpP) pick.p2ok = true;
    }
  }
  if (pick.p1ok && pick.p2ok){ resolveStage(); startGame(); }
}
function stepSettings(){
  const i = merge(merge(keyInput(P1KEYS), keyInput(P2KEYS)), padInput(0));
  if (pressed.has("escape") || pressed.has("enter") || i.lightP){ saveSettings(); state = "menu"; return; }
  if (i.upP) setRow = (setRow + 2) % 3;
  if (i.downP) setRow = (setRow + 1) % 3;
  const d = i.leftP ? -1 : i.rightP ? 1 : 0;
  if (!d) return;
  if (setRow === 0){
    const idx = STAGE_OPTIONS.findIndex(o => o.key === settings.stage);
    settings.stage = STAGE_OPTIONS[(idx + d + STAGE_OPTIONS.length) % STAGE_OPTIONS.length].key;
  } else if (setRow === 1) settings.stocks = Math.max(1, Math.min(5, settings.stocks + d));
  else {
    const idx = DIFF_KEYS.indexOf(settings.cpu);
    settings.cpu = DIFF_KEYS[(idx + d + DIFF_KEYS.length) % DIFF_KEYS.length];
  }
}
function step(dt){
  animT += dt;
  if (state === "playing" || state === "over"){
    if (!paused) updateAmbient(dt);
    if (P1 && P2){
      const alive = [P1, P2].filter(f => !f.dead);
      const tx = alive.length ? alive.reduce((a, f) => a + f.x, 0) / alive.length : W/2;
      bgShift += ((W/2 - tx) * 0.04 - bgShift) * Math.min(1, dt * 2);
    }
  }
  if (state === "menu"){
    if (pressed.has("1") || menuStartPressed()){ vsCpu = true; goSelect(); }
    else if (pressed.has("2")){ vsCpu = false; goSelect(); }
    else if (pressed.has("3")){ setRow = 0; state = "settings"; }
    return;
  }
  if (state === "select"){ stepSelect(); return; }
  if (state === "settings"){ stepSettings(); return; }
  if (state === "over"){
    if (pressed.has("r") || pressed.has("enter")){ resolveStage(); startGame(); }
    if (pressed.has("c")) goSelect();
    if (pressed.has("m")) state = "menu";
    updateFx(dt);
    return;
  }
  if (pressed.has("p") || pressed.has("escape")) paused = !paused;
  if (paused) return;
  playTime += dt;
  shake *= 0.86;
  if (hitstop > 0){ hitstop -= dt; return; }
  updatePlats(dt);
  const i1 = merge(keyInput(P1.keys), padInput(0));
  const i2 = P2.cpu ? cpuInput(P2, P1) : merge(keyInput(P2.keys), padInput(1));
  updateFighter(P1, i1, dt);
  updateFighter(P2, i2, dt);
  checkHits(P1, P2); checkHits(P2, P1);
  updateProjs(dt);
  updateFx(dt);
}

// ─── Drawing ───
function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function drawCover(img, x, y, w, h){
  const ir = img.naturalWidth / img.naturalHeight, r = w / h;
  let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
  if (ir > r){ sw = sh * r; sx = (img.naturalWidth - sw) / 2; } else { sh = sw / r; sy = (img.naturalHeight - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function drawBackground(){
  const img = STAGE && BG_IMG[STAGE.key];
  if ((state === "playing" || state === "over") && img && img.complete && img.naturalWidth){
    drawCover(img, -40 + bgShift, -40, W + 80, H + 80);
    const o = ctx.createLinearGradient(0, 0, 0, H);           // darken so fighters stay readable
    const d = DIM[STAGE.key] || [0.35, 0.5, 0.85];
    o.addColorStop(0, `rgba(11,14,19,${d[0]})`); o.addColorStop(0.6, `rgba(11,14,19,${d[1]})`); o.addColorStop(1, `rgba(11,14,19,${d[2]})`);
    ctx.fillStyle = o; ctx.fillRect(-50, -50, W + 100, H + 100);
    return;
  }
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#151B26"); g.addColorStop(1, "#07090C");
  ctx.fillStyle = g; ctx.fillRect(-50, -50, W+100, H+100);
  ctx.strokeStyle = "rgba(201,161,90,0.07)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W/2, 420, 330, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2, 420, 250, 0, Math.PI*2); ctx.stroke();
}
function gradFill(y0, y1, c0, c1){ const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; }
function drawTorch(x, y){
  ctx.fillStyle = "#3A2A1A"; ctx.fillRect(x - 3, y, 6, 36);
  ctx.fillStyle = "#5A4630"; ctx.fillRect(x - 8, y - 4, 16, 6);
  const fl = 1 + Math.sin(animT * 17 + x) * 0.12 + Math.sin(animT * 29 + x * 2) * 0.08;
  const g = ctx.createRadialGradient(x, y - 14, 2, x, y - 14, 70 * fl);
  g.addColorStop(0, "rgba(255,190,90,0.45)"); g.addColorStop(1, "rgba(255,140,40,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 14, 70 * fl, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#FF8A2A"; ctx.beginPath(); ctx.ellipse(x, y - 14, 7 * fl, 14 * fl, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#FFE08A"; ctx.beginPath(); ctx.ellipse(x, y - 11, 3.5 * fl, 8 * fl, 0, 0, Math.PI*2); ctx.fill();

function drawColumn(cx, top, bottom, w){

function drawAmbient(front){

function swordAngle(f){
  const idle = 0.6;
  if (f.grabbing) return 1.1;
  const A = atk(f);
  if (!A) return idle;
  const lerp = (a, b, k) => a + (b - a) * Math.max(0, Math.min(1, k));
  let wind, end;
  switch (A.anim){
    case "overhead": wind = -2.3; end = 0.5; break;
    case "up":       wind = 0.9;  end = -2.7; break;
    case "thrust":   wind = 0.2;  end = 0.0; break;
    case "grab":     wind = 1.0;  end = 1.1; break;
    case "idle":     return idle;
    default:         wind = -1.2; end = 0.5;
  }
  const t = f.atkT;
  if (t < A.startup) return lerp(idle, wind, t / A.startup);
  if (t < A.startup + A.active) return lerp(wind, end, (t - A.startup) / Math.max(0.001, A.active));
  return lerp(end, idle, (t - A.startup - A.active) / A.recovery);
}

  ctx.beginPath(); ctx.arc(0, -h/2 + 12, 15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = white ? "#FFFFFF" : "rgba(0,0,0,0.25)";
  ctx.fillRect(-w/2, -h/2 + 46, w, 6);
  ctx.fillStyle = "#0B0E13";

}
function drawSword(facing, ang, len, active){

  ctx.lineCap = "round";
  if (active){ ctx.strokeStyle = "rgba(255,233,176,0.35)"; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke(); }
  ctx.strokeStyle = "#E8E8E8"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = "#C9A15A"; ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI*2); ctx.fill();
}
function drawFighter(f){

  ctx.globalAlpha = f.dodgeT > 0 ? 0.45 : blink ? 0.4 : 1;
  ctx.translate(f.x, f.y - f.h/2);

  ctx.fillText(f.tag + " " + f.name, f.x, f.y - f.h - 22);

  centerText("P2: Arrows move & jump · K light · L heavy · O signature · I grab · J shield/dodge", 472, 15, "#B7BFC9", "normal");
  centerText("Hold UP while attacking for up-attacks · hold DOWN to drop through platforms", 496, 15, "#B7BFC9", "normal");
  centerText("Controller: stick move · A jump · X light · B heavy · Y signature · LB grab · RB/triggers shield", 520, 15, "#B7BFC9", "normal");
  centerText("ATTACK beats GRAB · GRAB beats SHIELD · SHIELD beats ATTACK", 568, 18, "#C9A15A");
  centerText("Grab, then hold a direction to throw: → Double Leg · ← Hip Throw · ↑ Suplex · ↓ Takedown", 594, 15, "#B7BFC9", "normal");
  if ("ontouchstart" in window) centerText("Keyboard or controller needed — touch controls come later.", 672, 15, "#E86A6A", "normal");
}
function wrap(text, x, y, maxW, lineH){
  const words = text.split(" "); let line = "";
  for (const w of words){
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line){ ctx.fillText(line, x, y); line = w; y += lineH; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, y);
}
function statLevel(m){ return Math.max(1, Math.min(5, Math.round((m - 0.8) / 0.5 * 4) + 1)); }
function drawSelect(){
  drawBackground();
  centerText("CHOOSE YOUR WARRIOR", 80, 40, "#C9A15A");
  const cw = 220, gap = 18, x0 = (W - (cw * 5 + gap * 4)) / 2, y0 = 120, ch = 420;
  WARRIORS.forEach((Wr, i) => {
    const x = x0 + i * (cw + gap);
    ctx.fillStyle = "rgba(29,35,45,0.95)"; roundRect(x, y0, cw, ch, 16); ctx.fill();
    ctx.fillStyle = Wr.color; ctx.fillRect(x, y0, cw, 6);
    // mini fighter
    ctx.save(); ctx.translate(x + cw/2, y0 + 80); drawBody(Wr.color, 1, false); drawSword(1, 0.6, 46 * Wr.reach, false); ctx.restore();
    ctx.textAlign = "center"; ctx.fillStyle = Wr.color; ctx.font = "900 24px system-ui"; ctx.fillText(Wr.name, x + cw/2, y0 + 158);
    ctx.fillStyle = "#8B95A3"; ctx.font = "13px system-ui"; ctx.fillText(Wr.title, x + cw/2, y0 + 178);
    const stats = [["SPEED", Wr.speed], ["POWER", Wr.power], ["WEIGHT", Wr.weight], ["REACH", Wr.reach]];
    stats.forEach(([label, m], j) => {
      const sy = y0 + 206 + j * 26;
      ctx.textAlign = "left"; ctx.fillStyle = "#B7BFC9"; ctx.font = "bold 11px system-ui"; ctx.fillText(label, x + 16, sy + 9);
      const lvl = statLevel(m);
      for (let k = 0; k < 5; k++){ ctx.fillStyle = k < lvl ? Wr.color : "rgba(255,255,255,0.1)"; ctx.fillRect(x + 82 + k * 25, sy, 21, 10); }
    });
    ctx.textAlign = "center"; ctx.fillStyle = "#C9A15A"; ctx.font = "bold 14px system-ui";
    ctx.fillText("★ " + Wr.sigName, x + cw/2, y0 + 336);
    ctx.fillStyle = "#B7BFC9"; ctx.font = "12px system-ui";
    wrap(Wr.sigDesc, x + cw/2, y0 + 358, cw - 30, 16);
    // cursors
    const sel1 = pick.p1 === i, sel2 = pick.p2 === i && (!vsCpu || pick.p2ok);
    if (sel1){ ctx.strokeStyle = pick.p1ok ? "#C9A15A" : "#FFFFFF"; ctx.lineWidth = 4; roundRect(x - 3, y0 - 3, cw + 6, ch + 6, 18); ctx.stroke(); }
    if (sel2){ ctx.strokeStyle = "#4A9FD0"; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); roundRect(x - 9, y0 - 9, cw + 18, ch + 18, 22); ctx.stroke(); ctx.setLineDash([]); }
    ctx.font = "bold 13px system-ui";
    if (sel1){ ctx.textAlign = "left"; ctx.fillStyle = "#FFFFFF"; ctx.fillText(pick.p1ok ? "P1 READY" : "P1", x + 8, y0 + ch + 26); }
    if (sel2){ ctx.textAlign = "right"; ctx.fillStyle = "#4A9FD0"; ctx.fillText(vsCpu ? "CPU" : (pick.p2ok ? "P2 READY" : "P2"), x + cw - 8, y0 + ch + 26); }
  });
  centerText(vsCpu ? "P1: A / D to choose · F to confirm · Esc back" : "P1: A / D choose · F confirm      P2: ← / → choose · K confirm      Esc back", 650, 15, "#8B95A3", "normal");
}
function drawSettings(){
  drawBackground();
  centerText("SETTINGS", 100, 44, "#C9A15A");
  const opt = STAGE_OPTIONS.find(o => o.key === settings.stage);
  const rows = [
    ["DEFAULT STAGE", opt.name, opt.desc],
    ["STOCKS (LIVES)", String(settings.stocks), settings.stocks === 1 ? "One life — sudden death" : settings.stocks + " lives each"],
    ["CPU DIFFICULTY", DIFFS[settings.cpu].name, settings.cpu === "easy" ? "Slow reactions, rarely blocks" : settings.cpu === "hard" ? "Fast reactions, blocks and dodges a lot" : "A fair fight"],
  ];
  rows.forEach(([label, val, sub], i) => {
    const y = 180 + i * 110, x = 120, w = 620, sel = setRow === i;
    ctx.fillStyle = sel ? "rgba(201,161,90,0.14)" : "rgba(29,35,45,0.9)"; roundRect(x, y, w, 90, 14); ctx.fill();
    if (sel){ ctx.strokeStyle = "#C9A15A"; ctx.lineWidth = 3; roundRect(x, y, w, 90, 14); ctx.stroke(); }
    ctx.textAlign = "left"; ctx.fillStyle = "#8B95A3"; ctx.font = "bold 13px system-ui"; ctx.fillText(label, x + 24, y + 30);
    ctx.fillStyle = "#EDEFF2"; ctx.font = "900 26px system-ui"; ctx.fillText((sel ? "◀  " : "") + val + (sel ? "  ▶" : ""), x + 24, y + 64);
    ctx.textAlign = "right"; ctx.fillStyle = "#8B95A3"; ctx.font = "13px system-ui"; ctx.fillText(sub, x + w - 24, y + 64);
  });
  // stage preview
  const px = 790, py = 180, pw = 370, ph = 208;
  ctx.fillStyle = "rgba(29,35,45,0.9)"; roundRect(px, py, pw, ph + 102, 14); ctx.fill();
  ctx.save(); roundRect(px, py, pw, ph, 14); ctx.clip();
  const st = STAGES.find(x => x.key === settings.stage);
  if (st && BG_IMG[st.key] && BG_IMG[st.key].complete && BG_IMG[st.key].naturalWidth) drawCover(BG_IMG[st.key], px, py, pw, ph);
  else {
    ctx.fillStyle = "#232A36"; ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = "#C9A15A"; ctx.font = "900 64px system-ui"; ctx.textAlign = "center"; ctx.fillText("?", px + pw/2, py + ph/2 + 22);
  }
  ctx.restore();
  const sc = (pw - 40) / W, lx = px + 20, ly = py + ph + 14;
  if (st){
    ctx.fillStyle = "#C9A15A"; ctx.fillRect(lx + st.main.x * sc, ly + (st.main.y - 150) * sc, st.main.w * sc, 5);
    ctx.fillStyle = "#8B95A3"; for (const p of st.plats) ctx.fillRect(lx + p.x * sc, ly + (p.y - 150) * sc, p.w * sc, 3);
  } else { ctx.fillStyle = "#8B95A3"; ctx.font = "13px system-ui"; ctx.textAlign = "center"; ctx.fillText("Stage decided when the match starts", px + pw/2, ly + 40); }
  centerText("W / S choose setting   ·   A / D change   ·   F or Esc to save", 560, 15, "#8B95A3", "normal");
  centerText("Settings are saved on this device.", 586, 13, "#5D6673", "normal");
}
function drawBanner(){
  if (playTime > 2.6) return;
  ctx.globalAlpha = Math.min(1, (2.6 - playTime) / 0.5, playTime / 0.25);
  ctx.fillStyle = "rgba(11,14,19,0.75)"; ctx.fillRect(0, 118, W, 78);
  centerText(STAGE.name, 155, 34, "#EDEFF2", "900");
  centerText(homeTag ? homeTag.tag + " " + homeTag.name + "'S HOME TURF" : "NEUTRAL GROUND", 182, 15, homeTag ? homeTag.color : "#8B95A3");
  ctx.globalAlpha = 1;
}
function draw(){
  ctx.save();
  if (state === "settings"){ drawSettings(); ctx.restore(); return; }
  if (state === "menu"){ drawMenu(); ctx.restore(); return; }
  if (state === "select"){ drawSelect(); ctx.restore(); return; }
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.translate(sx, sy);
  drawBackground();
  drawAmbient(false);
  if (STAGE.key === "viking") drawWater(false);
  drawStage();
  drawFighter(P1); drawFighter(P2);
  drawProjs(); drawParticles();
  drawAmbient(true);
  if (STAGE.key === "viking") drawWater(true);
  drawVignette();
  drawFloats();
  drawOffscreen(P1); drawOffscreen(P2);
  ctx.restore();
  drawHUD();
  drawBanner();
  if (paused){
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H);
    centerText("PAUSED", H/2, 48, "#EDEFF2"); centerText("Press P to resume", H/2 + 40, 16, "#8B95A3", "normal");
  }
  if (state === "over"){
    ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, 0, W, H);
    centerText(winner.tag + " " + winner.name + " WINS", H/2 - 20, 60, winner.color);
    centerText("R — rematch    ·    C — change warriors    ·    M — menu", H/2 + 30, 18, "#B7BFC9", "normal");
  }
}

// ─── Fixed-timestep loop (same speed on every device) ───
const STEP = 1/60;
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(0.25, (now - last) / 1000); last = now;
  while (acc >= STEP){ step(STEP); acc -= STEP; pressed.clear(); }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
